/* Fotos: coloca los archivos en assets/fotos/ con el nombre que se muestra en la pestaña "Expositores" (ej. jorge-nakamura.jpg) */
const PHOTO='assets/fotos/',EXT=['jpg','jpeg','png','webp'];
const DEF='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#e3e7ee"/><circle cx="32" cy="25" r="11" fill="#9aa5b8"/><path d="M10 64c2-15 12-22 22-22s20 7 22 22z" fill="#9aa5b8"/></svg>');
function nx(i){const k=+i.dataset.i+1;if(k<EXT.length){i.dataset.i=k;i.src=PHOTO+i.dataset.s+'.'+EXT[k]}else{i.onerror=null;i.src=DEF}}
const GEN=['registro','acto','plenaria','almuerzo'];
const S={view:'dia',day:'all',car:'med',gen:true,qa:true,mode:'cron',q:''};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const car=id=>D.careers[id];
const sala=s=>s.sala?`Sala ${s.sala} · ${D.salas[s.sala]}`:(s.room||'');
const av=x=>`<img class="av" alt="" loading="lazy" src="${PHOTO}${x.s}.${EXT[0]}" data-s="${x.s}" data-i="0" onerror="nx(this)">`;
function pick(){
 let a=D.sessions.filter(s=>S.day==='all'||s.day===S.day);
 if(!S.qa)a=a.filter(s=>s.kind!=='qa');
 if(S.view==='car')a=a.filter(s=>s.careers.includes(S.car)||(S.gen&&GEN.includes(s.kind)));
 if(S.q){const q=norm(S.q);a=a.filter(s=>norm(JSON.stringify([s.speakers.map(x=>x.n),s.topic,s.who,s.room,s.title])).includes(q))}
 return a}
function card(s){
 const cs=s.careers.map(car).map(c=>'#'+c.color);const g=cs.length?`linear-gradient(${(cs.length>1?cs:[cs[0],cs[0]]).join(',')})`:'#98a2b3';
 const tags=[`<span class="tag">${esc(sala(s))}</span>`].filter(()=>sala(s)).concat(s.careers.map(c=>`<span class="cc" style="background:#${car(c).color}">${esc(car(c).name)}</span>`));
 if(s.virtual)tags.push(`<span class="virt">VIRTUAL${s.country?' · '+s.country:''}</span>`);else if(s.country)tags.push(`<span class="tag">${s.country}</span>`);
 if(s.mod)tags.push(`<span class="tag">${esc(s.mod)}</span>`);
 if(s.pending)tags.push('<span class="warn">PENDIENTE</span>');
 let body;
 if(s.kind==='qa')body=`<div class="nm">Preguntas y respuestas${s.who?' · '+esc(s.who):''}</div>`;
 else if(s.kind==='charla'||s.kind==='workshop'||s.kind==='plenaria'){
  const pre=s.kind==='workshop'?'Workshop: ':s.kind==='plenaria'?'Plenaria: ':'';
  if(!s.topic&&s.speakers.length)tags.push('<span class="warn">SIN TEMA</span>');
  body=`<div class="who"><div class="avs">${s.speakers.map(av).join('')||`<img class="av" alt="" src="${DEF}">`}</div><div><div class="nm">${esc(s.speakers.map(x=>x.n).join(' / ')||'Expositor por definir')}</div><div class="tp">${s.topic?esc(pre+s.topic):''}</div></div></div>`}
 else body=`<div class="nm">${esc(s.title)}</div>`;
 const n=s.notes.length?`<div class="note">${s.notes.map(esc).join(' · ')}</div>`:'';
 return `<article class="s ${s.kind==='qa'?'qa':''} ${GEN.includes(s.kind)?'gen':''}" style="--g:${g}"><div class="t">${s.start}<small>${s.end}</small></div><div class="b"><div class="meta">${tags.join('')}</div>${body}${n}</div></article>`}
function dayBlock(d,a){
 if(!a.length)return '';
 let h=`<h2>${d.label}</h2>`;
 if(S.mode==='sala'){
  const c=[1,2,3,4].map(n=>`<div><h3>Sala ${n} · ${esc(D.salas[n])}</h3>${a.filter(s=>s.sala===n).map(card).join('')}</div>`);
  c.push(`<div><h3>Actos generales y workshops</h3>${a.filter(s=>!s.sala).map(card).join('')}</div>`);
  return h+`<div class="cols">${c.join('')}</div>`}
 return h+`<div class="list">${a.map(card).join('')}</div>`}
function speakers(a){const m={};a.forEach(s=>s.speakers.forEach(x=>{(m[x.s]??={x,l:[]}).l.push(s)}));return Object.values(m).sort((p,q)=>p.x.d.localeCompare(q.x.d))}
function render(){

  h=al.length?['conflicto','pendiente','revisar'].map(l=>{const z=al.filter(x=>x.level===l);return z.length?`<h2>${{conflicto:'Cruces de horario o sala',pendiente:'Datos pendientes',revisar:'Por confirmar con la organización'}[l]} (${z.length})</h2>`+z.map(x=>`<div class="al" style="--c:${col[l]}"><b>${x.day==='general'?'General':D.days.find(d=>d.id===x.day).short}</b>${esc(x.text)}</div>`).join(''):''}).join(''):'<div class="empty">Sin alertas para este día.</div>'}
 else if(S.view==='exp'){
  const sp=speakers(a);h=`<p class="sum">${sp.length} expositores. Nombre de archivo esperado en <code>${PHOTO}</code>:</p><div class="sp">`+sp.map(({x,l})=>`<div class="sc">${av(x)}<div><div class="nm">${esc(x.n)}</div><button class="btn fn" data-c="${x.s}.jpg" title="Copiar nombre de archivo">${x.s}.jpg</button><ul>${l.map(s=>`<li>${D.days.find(d=>d.id===s.day).short} ${s.start} · ${esc(s.topic||s.title||'sin tema')}</li>`).join('')}</ul></div></div>`).join('')+'</div>'}
 else{
  h=a.length?D.days.map(d=>dayBlock(d,a.filter(s=>s.day===d.id))).join(''):'<div class="empty">No hay actividades con estos filtros.</div>';
  const sp=speakers(a).length;h=`<p class="sum">${a.length} actividades · ${sp} expositores${S.view==='car'?' · '+car(S.car).name:''}</p>`+h}
 $('#app').innerHTML=h}
function ui(){
 const V=[['dia','Día general'],['car','Por carrera'],['exp','Expositores'],['al','Alertas ('+D.alerts.length+')']];

 $('#days').innerHTML=[['all','Todos los días']].concat(D.days.map(d=>[d.id,d.short])).map(([k,n])=>`<button class="btn" aria-pressed="${S.day===k}" data-d="${k}">${n}</button>`).join('');

 $('#mode').setAttribute('aria-pressed',S.mode==='sala');$('#mode').textContent=S.mode==='sala'?'Ver cronológico':'Ver por sala';$('#mode').hidden=S.view==='exp'||S.view==='al'}
const go=()=>{ui();render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){S.view=b.dataset.v;go()}else if(b.dataset.d){S.day=b.dataset.d;go()}else if(b.dataset.c&&b.classList.contains('chip')){S.car=b.dataset.c;go()}
 else if(b.classList.contains('fn'))copy(b.dataset.c);else if(b.id==='mode'){S.mode=S.mode==='sala'?'cron':'sala';go()}});
$('#q').oninput=e=>{S.q=e.target.value;render()};$('#qa').onchange=e=>{S.qa=e.target.checked;render()};$('#gen').onchange=e=>{S.gen=e.target.checked;render()};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function copy(t){const f=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()};
 (navigator.clipboard?navigator.clipboard.writeText(t).catch(f):Promise.resolve(f())).then(()=>toast('Copiado'))}
const line=s=>[s.start+' - '+s.end,sala(s),s.careers.map(c=>car(c).name).join(' + '),s.kind==='qa'?'Preguntas y respuestas'+(s.who?' ('+s.who+')':''):(s.speakers.map(x=>x.n).join(' / ')||s.title||''),s.topic||'',s.virtual?'VIRTUAL'+(s.country?' - '+s.country:''):'',s.mod||''].filter(Boolean).join(' | ');
$('#cp').onclick=()=>{const a=pick();copy(D.days.map(d=>{const z=a.filter(s=>s.day===d.id);return z.length?d.label.toUpperCase()+'\n'+z.map(line).join('\n'):''}).filter(Boolean).join('\n\n'))};
$('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
